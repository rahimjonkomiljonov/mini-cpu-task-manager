# Builds the application for Windows and for macOS on GitHub's computers.
#
# How to use it: open the "Actions" tab of the repository on GitHub,
# choose "Build the application", press "Run workflow", wait about a minute,
# then download the two files under "Artifacts".

name: Build the application

on:
  workflow_dispatch:        # run by hand from the Actions tab
  push:
    tags: ["v*"]            # and for every version tag, for example v1.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: dist/Mini CPU Task Manager.exe
            name: MiniCPUTaskManager-Windows
          - os: macos-latest                    # Apple Silicon (M1 and newer)
            file: dist/Mini CPU Task Manager.app.zip
            name: MiniCPUTaskManager-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python -m unittest tests.test_engine tests.test_manage -v     # the simulator must be correct first
      - run: python build_app.py
      - name: Start the Mac application and check that it stays open
        if: runner.os == 'macOS'
        run: |
          "dist/Mini CPU Task Manager.app/Contents/MacOS/Mini CPU Task Manager" &
          sleep 8
          kill -0 $!        # this fails if the application has already closed (for example: a crash at start)
          kill $!
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.file }}
